name: CI

# Runs the test suite on every push and pull request.
#
# Matrix rationale:
#   - macOS + Linux run the FULL `bun test` differential suite (node is the oracle,
#     and both have a POSIX-complete runtime for runtime/runtime.c).
#   - Windows runs a REDUCED job: the runtime has POSIX-only deps (termios / unistd /
#     ucontext), so the full suite cannot pass there yet. Instead we prove the compiler
#     BUNDLES on Windows and (when the `--target windows` lane is merged) that it can
#     compile + run a native Windows binary. Full Windows parity is a runtime-port
#     follow-on, tracked separately.

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Full suite: macOS (host oracle) + Linux -----------------------------
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install clang (Linux; the runtime toolchain the tests link through)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libcurl4-openssl-dev
      - run: bun install --frozen-lockfile
      # node is preinstalled on GitHub runners (the differential oracle);
      # the cross-target tests (iOS / Android / wasm) skip gracefully headless.
      - run: bun test

  # ---- Reduced Windows job: bundle (hard gate) + native smoke (best-effort) -
  #
  # WHY REDUCED: runtime/runtime.c depends on POSIX headers (termios / unistd /
  # ucontext) that Windows lacks, so `bun test` (which links the full runtime)
  # cannot pass here yet. We therefore split into two gates with DIFFERENT strictness:
  #
  #   1. HARD GATE — build the self-contained compiler (`bun run compile`). This proves
  #      the whole TypeScript compiler + embedded C runtime BUNDLES on Windows. It needs
  #      only bun (no external toolchain), so it is a reliable red/green signal.
  #
  #   2. BEST-EFFORT — compile + run a POSIX-free program to a native Windows PE via
  #      `--target windows`, and assert stdout. This links through clang targeting
  #      `x86_64-pc-windows-msvc`, which requires a Windows-capable clang + the MSVC/UCRT
  #      SDK headers + lld-link. Those live on the `windows-latest` image but their exact
  #      presence/PATH/version is outside our control and historically flaky, so a gap
  #      here must NOT turn the whole workflow red. We make it non-fatal via
  #      `continue-on-error: true` on JUST that step (a failure shows as a yellow annotation,
  #      the job still passes), and the step also self-detects a missing clang and notices-out
  #      cleanly instead of erroring. Full Windows parity is a runtime-port follow-on.
  windows-smoke:
    name: windows-smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # HARD GATE: bundling the compiler must succeed. `bun --compile` emits nativets.exe.
      - name: Build self-contained nativets binary (proves it bundles on Windows)
        shell: bash
        run: |
          bun run compile
          test -f nativets.exe || { echo "expected nativets.exe from 'bun run compile'"; exit 1; }
          echo "bundle OK: $(ls -l nativets.exe | awk '{print $5}') bytes"
      # BEST-EFFORT: ensure a Windows clang is available for the native PE build. chocolatey
      # is preinstalled on windows-latest; LLVM may already be on the image, so this is idempotent.
      # Non-fatal — the smoke step below self-skips if clang still isn't reachable.
      - name: Install LLVM/clang for the native Windows build (best-effort)
        continue-on-error: true
        shell: pwsh
        run: choco install llvm -y --no-progress
      # BEST-EFFORT: a toolchain gap here is a yellow annotation, not a failed workflow.
      - name: Smoke test — compile + run a native Windows PE, assert stdout (best-effort)
        continue-on-error: true
        shell: bash
        run: |
          # Locate clang: PATH first, then the default chocolatey/LLVM install dir.
          if command -v clang >/dev/null 2>&1; then
            CLANG=clang
          elif [ -x "/c/Program Files/LLVM/bin/clang.exe" ]; then
            export PATH="/c/Program Files/LLVM/bin:$PATH"
            CLANG="/c/Program Files/LLVM/bin/clang.exe"
          else
            echo "::notice::no Windows-capable clang found — skipping the native --target windows PE smoke (bundling already proven above)"
            exit 0
          fi
          echo "using clang: $("$CLANG" --version | head -1)"
          # `--target windows` links x86_64-pc-windows-msvc; needs the MSVC/UCRT SDK + lld-link.
          # If that toolchain is incomplete on the runner, the build fails here — non-fatal
          # (continue-on-error), so a runtime-toolchain gap never reds the workflow.
          if ! ./nativets.exe build ci/smoke.ts -o smoke.exe --target windows; then
            echo "::warning::native --target windows build failed (likely a missing MSVC/UCRT SDK or lld-link on the runner) — non-fatal; bundling is the hard gate"
            exit 0
          fi
          ACTUAL="$(./smoke.exe)"
          EXPECTED=$'result=42\r\nhello world' # Windows stdout uses CRLF line endings
          # Normalize CRLF -> LF before comparing so the check is line-ending agnostic.
          if [ "$(printf '%s' "$ACTUAL" | tr -d '\r')" != "$(printf '%s' "$EXPECTED" | tr -d '\r')" ]; then
            echo "::warning::windows smoke stdout mismatch — expected 'result=42 / hello world', got: $ACTUAL"
            exit 1
          fi
          echo "windows smoke OK"
