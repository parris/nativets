name: CI

# Runs the test suite on every push and pull request.
#
# Matrix rationale:
#   - macOS + Linux run the FULL `bun test` differential suite (node is the oracle,
#     and both have a POSIX-complete runtime for runtime/runtime.c).
#   - Windows runs a REDUCED job: the runtime has POSIX-only deps (termios / unistd /
#     ucontext), so the full suite cannot pass there yet. Instead we prove the compiler
#     BUNDLES on Windows and (when the `--target windows` lane is merged) that it can
#     compile + run a native Windows binary. Full Windows parity is a runtime-port
#     follow-on, tracked separately.
#
# REPRODUCING THE LINUX JOB LOCALLY: `scripts/docker-test.sh [test/foo.test.ts]` runs
# this same suite in a container mirroring the ubuntu step below (clang + libcurl +
# node + bun), against your working tree — see docs/docker-linux.md. Worth reaching for
# whenever a job is red here and green on your Mac: the platforms genuinely differ
# (ASan enables LeakSanitizer on Linux and macOS has none, which kept this job red for
# five merges).

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Full suite: macOS (host oracle) + Linux -----------------------------
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Install clang (Linux; the runtime toolchain the tests link through)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libcurl4-openssl-dev
      - run: bun install --frozen-lockfile
      # node is preinstalled on GitHub runners (the differential oracle);
      # the cross-target tests (iOS / Android / wasm) skip gracefully headless.
      # --timeout: EVERY differential test compiles a binary with clang and runs it, and
      # bun's default per-test budget is 5s. That is fine on a warm dev machine and NOT
      # fine on a cold CI runner — `stdlib-url basic.ts` began timing out at exactly
      # 5000ms on ubuntu while the very next test on the same file passed in 1.7s. A
      # global budget is the right knob (52 test files compile); note bunfig.toml's
      # [test] timeout is NOT honored by bun, only this flag.
      - run: bun test --timeout 60000

  # ---- Reduced Windows job: bundle (hard gate) + native smoke (best-effort) -
  #
  # WHY REDUCED: runtime/runtime.c depends on POSIX headers (termios / unistd /
  # ucontext) that Windows lacks, so `bun test` (which links the full runtime)
  # cannot pass here yet. We therefore split into two gates with DIFFERENT strictness:
  #
  #   1. HARD GATE — build the self-contained compiler (`bun run compile`). This proves
  #      the whole TypeScript compiler + embedded C runtime BUNDLES on Windows. It needs
  #      only bun (no external toolchain), so it is a reliable red/green signal.
  #
  #   2. BEST-EFFORT — compile + run a POSIX-free program to a native Windows PE via
  #      `--target windows`, and assert stdout. This links through clang targeting
  #      `x86_64-pc-windows-msvc`, which requires a Windows-capable clang + the MSVC/UCRT
  #      SDK headers + lld-link. Those live on the `windows-latest` image but their exact
  #      presence/PATH/version is outside our control and historically flaky, so a gap
  #      here must NOT turn the whole workflow red. We make it non-fatal via
  #      `continue-on-error: true` on JUST that step (a failure shows as a yellow annotation,
  #      the job still passes), and the step also self-detects a missing clang and notices-out
  #      cleanly instead of erroring. Full Windows parity is a runtime-port follow-on.
  windows-smoke:
    name: windows-smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # HARD GATE: bundling the compiler must succeed. `bun --compile` emits nativets.exe.
      - name: Build self-contained nativets binary (proves it bundles on Windows)
        shell: bash
        run: |
          bun run compile
          test -f nativets.exe || { echo "expected nativets.exe from 'bun run compile'"; exit 1; }
          echo "bundle OK: $(ls -l nativets.exe | awk '{print $5}') bytes"
      # BEST-EFFORT: ensure a Windows clang is available for the native PE build. chocolatey
      # is preinstalled on windows-latest; LLVM may already be on the image, so this is idempotent.
      # Non-fatal — the smoke step below self-skips if clang still isn't reachable.
      - name: Install LLVM/clang for the native Windows build (best-effort)
        continue-on-error: true
        shell: pwsh
        run: choco install llvm -y --no-progress
      # BEST-EFFORT: a toolchain gap here is a yellow annotation, not a failed workflow.
      - name: Smoke test — compile + run a native Windows PE, assert stdout (best-effort)
        continue-on-error: true
        shell: bash
        run: |
          # Locate clang: PATH first, then the default chocolatey/LLVM install dir.
          if command -v clang >/dev/null 2>&1; then
            CLANG=clang
          elif [ -x "/c/Program Files/LLVM/bin/clang.exe" ]; then
            export PATH="/c/Program Files/LLVM/bin:$PATH"
            CLANG="/c/Program Files/LLVM/bin/clang.exe"
          else
            echo "::notice::no Windows-capable clang found — skipping the native --target windows PE smoke (bundling already proven above)"
            exit 0
          fi
          echo "using clang: $("$CLANG" --version | head -1)"
          # `--target windows` links x86_64-pc-windows-msvc; needs the MSVC/UCRT SDK + lld-link.
          # If that toolchain is incomplete on the runner, the build fails here — non-fatal
          # (continue-on-error), so a runtime-toolchain gap never reds the workflow.
          if ! ./nativets.exe build ci/smoke.ts -o smoke.exe --target windows; then
            echo "::warning::native --target windows build failed (likely a missing MSVC/UCRT SDK or lld-link on the runner) — non-fatal; bundling is the hard gate"
            exit 0
          fi
          ACTUAL="$(./smoke.exe)"
          EXPECTED=$'result=42\r\nhello world' # Windows stdout uses CRLF line endings
          # Normalize CRLF -> LF before comparing so the check is line-ending agnostic.
          if [ "$(printf '%s' "$ACTUAL" | tr -d '\r')" != "$(printf '%s' "$EXPECTED" | tr -d '\r')" ]; then
            echo "::warning::windows smoke stdout mismatch — expected 'result=42 / hello world', got: $ACTUAL"
            exit 1
          fi
          echo "windows smoke OK"

  # ---- Always-available compiler build -------------------------------------
  #
  # WHY THIS EXISTS: `release.yml` only fires on a VERSION BUMP, and package.json is
  # still the `0.0.0` placeholder — so it has never run and there is no binary to pull
  # anywhere. This job builds the self-contained compiler on EVERY push/PR and uploads
  # it as a workflow artifact, so every commit has a downloadable `nativets`.
  #
  # `bun run compile` bundles the TypeScript compiler + the embedded C runtime into one
  # executable. It needs only bun to BUILD; the produced binary needs only a system
  # `clang` to RUN (it shells out to clang to link the .ll it emits).
  build:
    name: build (${{ matrix.asset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: nativets-macos-arm64
            bin: nativets
          - os: ubuntu-latest
            asset: nativets-linux-x64
            bin: nativets
          - os: windows-latest
            asset: nativets-windows-x64.exe
            bin: nativets.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build self-contained nativets binary
        run: bun run compile
      - name: Name the platform asset
        shell: bash # git-bash on windows-latest, so `mv` works uniformly across the matrix
        run: mv "${{ matrix.bin }}" "${{ matrix.asset }}"
      # Prove the thing we ship actually compiles and runs a program, not just that it
      # bundled. POSIX-only runtime deps mean the native link is host-only, so the
      # end-to-end check runs on macOS/Linux; Windows keeps the bundle-only gate above.
      - name: Smoke test the built compiler
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y clang
          fi
          ./"${{ matrix.asset }}" run ci/smoke.ts
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # ---- Rolling `dev` prerelease --------------------------------------------
  #
  # Workflow artifacts require a GitHub login to download and expire; a release asset
  # has a STABLE, public URL. This keeps a `dev` prerelease pinned to the tip of main:
  #
  #   https://github.com/<owner>/<repo>/releases/download/dev/nativets-macos-arm64
  #
  # It is a PRERELEASE, so it never becomes "latest" and never shadows the real
  # version-bump releases that `release.yml` publishes. Gated on the full differential
  # suite passing, so `dev` is always a green build.
  dev-release:
    name: dev-release
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/replace the `dev` tag + release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Replace the rolling `dev` release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Delete-and-recreate (with --cleanup-tag) rather than uploading over the top:
          # it is idempotent and cannot leave assets from an older commit behind.
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev dist/* \
            --prerelease \
            --title "dev (main @ ${GITHUB_SHA:0:7})" \
            --notes "Rolling build of \`main\` (${GITHUB_SHA:0:7}). Not a stable release — see the tagged versions for those.

          Needs a system \`clang\` on PATH to link. Usage: \`nativets run file.ts\`, \`nativets build file.ts -o prog\`, \`nativets coverage file.ts\`."
